# iOS App Store numeric track IDs, resolved and verified live against the
# official iTunes Search API (https://itunes.apple.com/search) on 2026-07-30 —
# matched by developer/seller name against each real company entity, never
# guessed. See collectors/app_store.py.
#
# Android/Play Store is deliberately NOT included: there is no equivalent
# official public API, so pulling Android release notes would mean scraping
# the Play Store page — that requires the CCO/compliance sign-off CLAUDE.md's
# guardrail #5 calls for, which hasn't happened yet.
#
# Only competitors with a real, verified iOS app are listed here. Public.com,
# Kalshi, Polymarket, and Kraken are private/pre-IPO (no EDGAR pipeline) but do
# have real iOS apps, so they're included — this collector doesn't care about
# ownership/filings_path, only "is there an app to watch."

